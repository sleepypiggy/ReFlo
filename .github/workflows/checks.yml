name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests and scheduling scenarios
        run: |
          backend/.venv/bin/python -m unittest discover -v
          backend/.venv/bin/python demo_week.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests, lint and types
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npx next typegen
          npx tsc --noEmit
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression and live integration tests
        working-directory: frontend
        run: |
          npm run test:e2e
          npm run test:live
